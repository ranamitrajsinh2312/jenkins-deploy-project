version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devopsflow_postgres
    restart: always
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devopsflow_network

  # -------------------------------------------------------------
  # DevOpsFlow Portal Web Application
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devopsflow_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      APP_NAME: "DevOpsFlow Portal"
      APP_VERSION: "1.0.0-compose"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devops_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devopsflow_network

volumes:
  postgres_data:
    name: devopsflow_postgres_data

networks:
  devopsflow_network:
    name: devopsflow_network
    driver: bridge
